name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: TEGU
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "false"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'TEGU' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the TEGU kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

  payload:
    # M2->M3 bridge: package the fresh kernel into the tegu payload boot
    # image (mkadt -> mkpayload -> shim/build.sh). shim-boot-payload.img is
    # what the first hardware session boots after the diagnostics pass.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: k
      - name: Install aarch64 cross-toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu
      - name: Build payload boot image
        run: |
          python3 tools/mkadt.py tegu.adt --highmem
          python3 tools/mkpayload.py k/kernel.development.tegu tegu.adt tegu.payload
          bash shim/build.sh "$PWD/tegu.payload"
          mv shim/out/shim-boot.img shim/out/shim-boot-payload.img
      - name: Validate boot image header against stock
        run: |
          python3 - <<'EOF'
          import struct
          b = open('shim/out/shim-boot-payload.img','rb').read(4096)
          assert b[:8] == b'ANDROID!', 'bad magic'
          hv, = struct.unpack_from('<I', b, 40)
          assert hv == 4, f'header version {hv}'
          ks, rs, osv, hs = struct.unpack_from('<IIII', b, 8)
          assert hs == 1584, f'header_size {hs}'
          assert osv == 0x220001a9, f'os_version {osv:#x}'
          print(f'payload boot image v4 OK: kernel {ks}, payload {rs}, osv {osv:#x}')
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: shim-boot-payload
          path: shim/out/shim-boot-payload.img
          if-no-files-found: error

  qemu:
    # Pre-hardware smoke test: boot the fresh kernel in QEMU virt with the
    # tegu payload (mkadt --qemu) and archive the framebuffer decode, guest
    # exceptions and register dump. Evidence mode for now: the job records
    # the --fail-on-panic verdict but does not fail the build until the tegu
    # kernel's QEMU baseline is established on hardware day.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: k
      - name: Install QEMU + LLVM
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm llvm
      - name: Build QEMU payload
        run: |
          python3 tools/mkadt.py qemu.adt --qemu
          python3 tools/mkpayload.py k/kernel.development.tegu qemu.adt payload-qemu.bin \
            --cmdline 'debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam rd=md0'
      - name: Boot in QEMU (fail-on-panic verdict recorded, non-blocking)
        id: boot
        continue-on-error: true
        run: |
          set +e
          python3 tools/qemu-tegu.py payload-qemu.bin qemu_run \
            --kernel k/kernel.development.tegu --fail-on-panic --secs 45 \
            --hmp 'x /4gx 0xfffffe000c1e4000' \
            --hmp 'x /4gx 0xfffffe000c1f4000' \
            --hmp 'x /2gx 0xfffffe0007be1268' \
            --hmp 'x /3gx 0xfffffe0008072058'
          rc=$?
          echo "qemu verdict exit=$rc (0 ok, 2 panic, 3 undecodable)" | tee qemu_run/verdict.txt
          exit 0
      - name: Summarize
        run: cat qemu_run/result.json qemu_run/verdict.txt 2>/dev/null || true
      - name: GDB trace of the GIC io maps (evidence, issue #7)
        run: |
          sudo apt-get install -y -q gdb-multiarch
          (python3 tools/qemu-tegu.py payload-qemu.bin qemu_gdb --gdb > qemu_gdb.log 2>&1 &)
          sleep 10
          gdb-multiarch -batch \
            -ex 'set pagination off' \
            -ex 'target remote :1234' \
            -ex 'break *0xfffffe0007a78e60' \
            -ex 'commands' \
            -ex 'silent' \
            -ex 'printf "GICD_VA=%#lx phase=%d cursor=%#lx\n", $x0, *(int*)0xfffffe0007170208, *(unsigned long*)0xfffffe0007be1268' \
            -ex 'x/1wx $x0' \
            -ex 'continue' \
            -ex 'end' \
            -ex 'break *0xfffffe0007a78e70' \
            -ex 'commands' \
            -ex 'silent' \
            -ex 'printf "GICR_VA=%#lx\n", $x0' \
            -ex 'x/1wx $x0' \
            -ex 'continue' \
            -ex 'end' \
            -ex 'break *0xfffffe0007a78fcc' \
            -ex 'commands' \
            -ex 'silent' \
            -ex 'printf "FAULT x8=%#lx TTBR0=%#lx TTBR1=%#lx\n", $x8, $TTBR0_EL1, $TTBR1_EL1' \
            -ex 'x/1wx $x8' \
            -ex 'detach' \
            -ex 'end' \
            -ex 'continue' 2>&1 | tee gdb-trace.txt || true
          pkill -f qemu-system-aarch64 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-run
          path: |
            qemu_run/
            qemu_gdb/
            qemu_gdb.log
            gdb-trace.txt
          if-no-files-found: warn
